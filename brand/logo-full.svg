<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" fill="none">
  <!-- Beebeeb full logo: mark + wordmark side by side -->
  <!-- Mark (88x88, scaled from logo-mark.svg's 512x512 viewBox at 88/512 = 0.1719) -->
  <rect x="0" y="6" width="88" height="88" rx="17.5" fill="#F5B800"/>
  <g transform="translate(0, 6) scale(0.171875)">
    <rect x="138" y="68" width="72" height="360" rx="8" fill="#1A1714"/>
    <circle cx="312" cy="308" r="120" fill="#1A1714"/>
    <circle cx="316" cy="308" r="54" fill="#F5B800"/>
  </g>
  <!-- Wordmark -->
  <text
    x="108" y="76"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-2"
  >
    <tspan fill="#1A1714">beebeeb</tspan><tspan fill="#F5B800">.io</tspan>
  </text>
</svg>
