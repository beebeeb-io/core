<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" fill="none">
  <!-- Beebeeb full logo: mark + wordmark side by side -->
  <!-- Mark (amber square, dark b) -->
  <rect x="0" y="6" width="88" height="88" rx="18" fill="#F5B800"/>
  <text
    x="44" y="70"
    text-anchor="middle"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="60"
    font-weight="800"
    fill="#1A1714"
    letter-spacing="-2"
  >b</text>
  <!-- Wordmark -->
  <text
    x="108" y="76"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-2"
  >
    <tspan fill="#1A1714">beebeeb</tspan><tspan fill="#F5B800">.io</tspan>
  </text>
</svg>
