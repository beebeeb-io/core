<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Beebeeb mark: amber square, dark "b". Path-based — no font dependency.
       Optically centered: stem-heavy left side compensated by shifting the
       whole glyph slightly right of geometric center. -->
  <rect width="512" height="512" rx="102" fill="#F5B800"/>
  <g fill="#1A1714">
    <rect x="138" y="68" width="72" height="360" rx="8"/>
    <circle cx="312" cy="308" r="120"/>
    <circle cx="316" cy="308" r="54" fill="#F5B800"/>
  </g>
</svg>
