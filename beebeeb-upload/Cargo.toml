[package]
name = "beebeeb-upload"
version = "0.1.0"
edition = "2021"
description = "Upload protocol for Beebeeb E2E encrypted storage"
license = "AGPL-3.0-or-later"

[dependencies]
beebeeb-core = { path = "../beebeeb-core", default-features = false }
beebeeb-types = { path = "../beebeeb-types" }
reqwest = { version = "0.13", features = ["json", "native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "fs", "time"] }
uuid = { version = "1", features = ["v4"] }
thiserror = { workspace = true }
tracing = { workspace = true }

# Tests only: lets this crate's tests write v2 chunk frames while core's
# WRITE_FORMAT is still v1 (task 1908 read-only rollout). Never in a shipped build.
[dev-dependencies]
beebeeb-core = { path = "../beebeeb-core", default-features = false, features = ["test-support"] }
