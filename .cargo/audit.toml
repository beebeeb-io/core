# Read by `cargo audit` (the CI job "Dependency advisories, licenses & sources").
# An advisory is listed here only when no fix exists without a semver-major
# upgrade of a direct dependency. Each entry says why it is ignored and what
# removes it. Never add an id without that.
[advisories]
ignore = [
  # crypto-bigint 0.5.5, now only through opaque-ke 4.0.1 -> elliptic-curve
  # 0.13.8. The CLI-login ECDH moved to p256 0.14 (crypto-bigint 0.7), which the
  # advisory's fix needs. Core's OPAQUE suites are Ristretto255 and compile none
  # of elliptic-curve 0.13's arithmetic, but cargo audit still lists the crate.
  # No published opaque-ke moves off it. Removed when one does.
  "RUSTSEC-2026-0387",
  # zip 8.6.0: four advisories, all in archive extraction (ZipArchive::extract,
  # ZipStreamReader::extract). Core only writes archives (ZipWriter in
  # beebeeb-core/src/zip.rs) and never extracts one; its tests read entries back
  # with by_name. Fixed only in zip 9. Removed by the zip 9 upgrade.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  "RUSTSEC-2026-0429",
]
