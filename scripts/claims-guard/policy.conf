# claims-guard policy — synced verbatim into every product repo by sync.sh.
# Editing a copy under repos/*/scripts/claims-guard/ is a drift failure; edit
# THIS file and run `make claims-guard-sync`.

# Hosts the product is allowed to reach at runtime. Anything else needs a
# reviewed `.claims-allow` line naming why it is in the data path.
ALLOWED_HOSTS=(
  beebeeb.io www.beebeeb.io app.beebeeb.io api.beebeeb.io admin.beebeeb.io
  status.beebeeb.io cdn.beebeeb.io
  errors.beebeeb.io   # self-hosted GlitchTip ingest on app02 (pre-mortem item 07); added to both web CSPs
  fsn1.your-objectstorage.com   # object storage, Falkenstein (data path)
  api.mollie.com my.mollie.com
  localhost 127.0.0.1 0.0.0.0 10.0.2.2
)

# Hard deny-list: hosts that must never appear in a runtime surface, whatever
# the syntax around them. `pwnedpasswords` is here because task 0995 purged it
# and commit 626bd82 put it back nine days later.
DENIED_ORIGINS='pwnedpasswords\.com|cloudflare\.com|cloudflareinsights|challenges\.cloudflare|cdnjs\.cloudflare|unpkg\.com|cdn\.jsdelivr\.net|fonts\.googleapis\.com|fonts\.gstatic\.com|google-analytics\.com|googletagmanager\.com|sentry\.io|ingest\.sentry|postmarkapp\.com|api\.sendgrid\.com|mailgun\.(net|org)|amazonaws\.com|vercel\.app|netlify\.app|hcaptcha\.com|recaptcha\.net'

# Hosting-provider names. Allowed ONLY on the legal sub-processors page and the
# DPA (both allow-listed in repos/site/.claims-allow).
PROVIDER_NAMES='Hetzner|Leaseweb|OVHcloud|Scaleway|Contabo|Vultr|DigitalOcean|your-objectstorage\.com'

# Claims that require evidence we do not have yet. Removing one from this list
# requires a published artefact (an audit report, a certificate), not an opinion.
#
# The audit tokens are pre-mortem item 03's canon regex VERBATIM
# (docs/canon/public-claims.md): "audited (Rust|core|by)" and "audited 20YY".
# A bare "audited" is deliberately NOT here — it would flag the honest
# sentences item 03 writes ("has not been externally audited", "not yet been
# audited") and the true statements about competitors in
# repos/site/src/lib/comparisons.ts ("Audited (Securitum)"). "Unlimited version
# history" comes from pre-mortem item 08 (the catalog sells it, nothing enforces it).
#
# PORTABILITY: no `\b`. `git grep -E` on macOS (git 2.55, libc regex) matches
# ZERO lines for `\baudited\b` while ubuntu-latest matches — a `\b` token would
# pass silently in the local pre-commit hook and fail only in CI. Word
# boundaries are spelled with POSIX classes instead.
BANNED_CLAIMS='audited (Rust|core|by)|audited 20[0-9]{2}|(^|[^[:alnum:]_])DORA([^[:alnum:]_]|$)|bank-grade|military-grade|ISO ?27001|SOC ?2|NIS2 compliant|GDPR compliant|penetration test|Unlimited version history'

# Claims that are true only with more than one live region.
MULTI_REGION_CLAIMS='jurisdiction of choice|choose your region|region of your choice|pick your( data)? region'

# Non-live region names that must never appear in product copy — a fixed list
# per docs/canon/data-residency.md's own enforcement line, independent of
# LIVE_REGIONS. When a region activates, remove its name here in the SAME
# commit that adds it to LIVE_REGIONS (canon activation runbook step).
PHANTOM_REGIONS='helsinki|(^|[^[:alnum:]_])ede([^[:alnum:]_]|$)|nuremberg'   # no `\b` — see BANNED_CLAIMS

# Regions with a live storage pool. Mirrors the claims-guard:live-regions block
# in docs/canon/data-residency.md; step 3 of that file's activation runbook is
# "add the region here".
LIVE_REGIONS=(falkenstein)

# Where a runtime network call can hide.
#
# `src`, `public`, `packages`, `cms/src`, `targets`, `modules`, `marketing`
# are git glob pathspecs (`:(glob)**/x/**`), not bare names — a bare pathspec
# only matches a TOP-LEVEL dir (git prefix-matches literal, non-wildcard
# pathspecs from repo root), so a Cargo workspace's nested crates
# (`beebeeb-api/src`, `beebeeb-status/src`, ...) or an npm workspace's
# `packages/*/src` are invisible to a bare `src` entry. The glob form covers
# any depth in every repo. `index.html`/`README.md`/`app.json`/`ios`/`android`
# stay bare/root-only on purpose — they name the ONE trust document, or the
# one top-level native project dir, per repo — not every incidental
# `scripts/*/README.md` or vendored `app.json`.
#
# `:(glob)**/.env*` covers every tracked env file at any depth (.env,
# .env.production, .env.development, .env.prod.example, ...) — the two bare
# `*.env.example`/`*.env.template` entries below predate it and stay for a
# non-dotfile naming style, but the glob is what actually gives full coverage
# (task 1367 Task-2 follow-up P1: a nested `.env.production` was invisible).
# `:(glob)**/cms/src/**` covers CMS-seeded copy (site's Strapi seed content
# ships FAQ/blog copy there — its FAQ once said "GDPR compliant" and nothing
# scanned it). `ios`, `android`, `:(glob)**/targets/**` (iOS app-extension /
# widget targets), `:(glob)**/modules/**` (native modules) are mobile's
# native runtime surface; `:(glob)**/marketing/**` covers mobile's App Store
# artwork/metadata (a repo-local dir, distinct from the workspace's own
# `repos/marketing`) — this also sweeps in this workspace's own tracked
# `marketing/` scratch dir (changelog/competitive-intel notes), which is why
# claims-guard.sh's claim-check exclude set carves out `**/marketing/**/*.md`
# specifically (task 1367 follow-up): that dir's Markdown is internal
# documentation, same category as CHANGELOG.md/CLAUDE.md/RELEASE_NOTES.md,
# while shipped artwork/mockups (`.svg`/`.html`/`.strings`/`.txt`/...) under
# any `marketing/` dir stay scanned.
# `:(exclude,glob)android/**` (task 1420, narrowed after Codex review):
# Android is unshipped — iOS at launch, Android after (docs/canon/
# public-claims.md's Android-availability row; the crypto module is a stub
# that throws NotLinkedException). Every file under the REPO-ROOT `android/`
# today is Expo-prebuild-generated or React-Native-template scaffolding
# (build.gradle, gradlew*, gradle.properties, the gradle wrapper,
# proguard-rules.pro, and vendored AOSP/RN resource XML like
# rn_edit_text_material.xml) — build tooling and vendored boilerplate that
# never ships as authored product copy, not hand-written app source. It
# regenerates byte-identical on every `expo prebuild`, so per-file
# `.claims-allow` lines for its doc-comment URLs (developer.android.com,
# reactnative.dev, jitpack.io, gradle.org, the Apache-2.0 license header,
# a bit.ly link baked into RN's own template) would need re-approving on
# every regen for zero signal. Revisit this exclude when Android crypto is
# unstubbed and real hand-authored native source/copy starts landing there.
# NO leading `**/`, deliberately: this pathspec must match ONLY the
# repo-root `android/` tree (the Expo prebuild output), never a NESTED
# `android/` dir such as a native module's own platform folder
# (`modules/beebeeb-crypto/android/` is a real, hand-authored Expo native
# module with Kotlin bridging source — it must stay covered). Same
# glob-vs-bare root-anchoring rule already documented above for
# `ios`/`android`/`index.html`.
RUNTIME_PATHS=(
  ':(glob)**/src/**' ':(glob)**/public/**' ':(glob)**/packages/**'
  ':(glob)**/.env*' ':(glob)**/cms/src/**'
  ios android ':(glob)**/targets/**' ':(glob)**/modules/**' ':(glob)**/marketing/**'
  index.html nginx.conf app.json app.config.js
  astro.config.mjs metro.config.js Dockerfile Dockerfile.deploy
  '*.env.example' '*.env.template'
  ':(exclude,glob)android/**'
)

# Where user-facing copy lives. Same glob-vs-bare reasoning as RUNTIME_PATHS.
# Same root-anchored `android/**` exclude and reasoning as RUNTIME_PATHS
# above (task 1420, narrowed after Codex review — repo-root only, a nested
# module's own `android/` dir stays scanned).
USER_FACING_PATHS=(
  ':(glob)**/src/**' ':(glob)**/public/**' ':(glob)**/packages/**' ':(glob)**/cms/src/**'
  ios android ':(glob)**/targets/**' ':(glob)**/modules/**' ':(glob)**/marketing/**'
  index.html README.md app.json
  ':(exclude,glob)android/**'
)

# Hosts that show up inside network-shaped URL literals but are never an
# actual data-path destination: XML/JSON-LD namespace URIs and RFC-reserved
# documentation/test names. Checked by `in_non_network_host` in
# claims-guard.sh — treated as neither ALLOWED_HOSTS (a real fetch to one of
# these would still be wrong) nor unknown (it isn't a network call at all),
# so it produces no host-allowlist finding either way. `*.test`, `*.invalid`,
# `*.example` are matched by suffix in the engine (RFC 2606 / RFC 6761
# reserved test TLDs — any subdomain is documentation, not a real host);
# example.com/.net/.org are matched exactly (the literal RFC 2606 apex
# domains used as a placeholder, not every fictitious subdomain of them).
NON_NETWORK_HOSTS=(
  w3.org www.w3.org schema.org purl.org ns.adobe.com
  example.com example.net example.org
  git-lfs.github.com   # Git LFS's own pointer-file FORMAT marker
                        # (`version https://git-lfs.github.com/spec/v1`), not
                        # a fetch target — Git LFS's real transfer endpoint is
                        # configured separately via .lfsconfig/`lfs.url`. This
                        # string is a host-level exemption (unlike apple.com/
                        # schemas.android.com below, which are URL-prefix-
                        # scoped) because there is no legitimate PRODUCT code
                        # path that could ever construct a real fetch to it —
                        # it only ever appears as this exact spec-version
                        # line, inside an LFS pointer file. mobile's `*.a`
                        # xcframework binaries are LFS-tracked; a checkout
                        # without LFS smudge (task 1420: `actions/checkout`
                        # in mobile's CI has no `lfs: true`, so the "Claims
                        # guard" job sees the raw pointer TEXT instead of the
                        # real binary a local `git worktree add` smudges in —
                        # confirmed via `file` + `git lfs status` on the same
                        # path) sees this literal string as scannable text.
)

# EXACT literal URL PREFIXES that are never a real network destination —
# narrower than NON_NETWORK_HOSTS on purpose (task 1420, after Codex review):
# `www.apple.com` and `schemas.android.com` used to live in NON_NETWORK_HOSTS
# above, but that exempts the HOST everywhere it appears — a real runtime
# fetch to `https://www.apple.com/<anything-else>` would then silently slip
# past check_hosts() too. These two are fixed, boilerplate-stamped URL
# PREFIXES (an XML DOCTYPE public-identifier URL, an XML namespace URL), not
# hosts, so `strip_non_network_urls()` in claims-guard.sh removes only an
# EXACT match of one of these prefixes from a line before host extraction —
# any OTHER reference to the same host, anywhere else, is still examined
# and still fails if unknown.
NON_NETWORK_URL_PREFIXES=(
  'http://www.apple.com/DTDs/'      # `<!DOCTYPE plist PUBLIC ... "http://www.apple.com/DTDs/PropertyList-1.0.dtd">`
                                     # — the fixed DOCTYPE line Xcode stamps on every .plist/.entitlements/
                                     # .xcprivacy file it generates; verified byte-identical across every
                                     # ios/**/*.plist and *.entitlements in mobile, never a different use
  'http://schemas.android.com/'     # `xmlns:android="http://schemas.android.com/..."` — the fixed XML
                                     # namespace URL Android tooling stamps on every manifest/resource XML
                                     # file it generates; same class as schema.org above, never fetched
)

# Test-file paths excluded from the host-allowlist check only (check_hosts in
# claims-guard.sh). A test fixture legitimately hardcodes a throwaway host
# (api.test, mock.example.dev, localhost) that would otherwise need a
# per-file .claims-allow line; the other checks (banned-origin, provider-name,
# banned-claim, phantom-region, region-claim) still scan test files normally.
TEST_FILE_EXCLUDES=(
  ':(exclude,glob)**/*.test.*' ':(exclude,glob)**/*.spec.*'
  ':(exclude,glob)**/tests/**' ':(exclude,glob)**/e2e/**' ':(exclude,glob)**/__tests__/**'
)
