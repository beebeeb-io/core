[package]
name = "beebeeb-uniffi"
description = "UniFFI bindings (Swift + Kotlin) for Beebeeb crypto core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "beebeeb_uniffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
beebeeb-core = { path = "../beebeeb-core" }
beebeeb-types = { path = "../beebeeb-types" }
beebeeb-upload = { path = "../beebeeb-upload" }
uniffi = { version = "0.31.1", features = ["cli"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt"] }
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }
