[package]
name = "beebeeb-uniffi"
description = "UniFFI bindings (Swift + Kotlin) for Beebeeb crypto core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "beebeeb_uniffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
# Pulls in uniffi_bindgen + uniffi_udl + weedle + cargo_metadata + clap + toml
# (~5 MB of code in the iOS staticlib). Only enabled when regenerating Swift
# bindings via the `uniffi-bindgen` binary; not needed by the shipping cdylib.
cli = ["uniffi/cli"]

[dependencies]
beebeeb-core = { path = "../beebeeb-core" }
beebeeb-types = { path = "../beebeeb-types" }
beebeeb-upload = { path = "../beebeeb-upload" }
uniffi = { version = "0.31.1" }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt"] }
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }
