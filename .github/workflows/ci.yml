name: CI

permissions: {}

on:
  push:
    branches: [main]
  # Every base branch, not only main: a PR stacked on a feature branch gets CI too (task 2381).
  pull_request:

# A new push to a PR cancels that PR's older run. Every other run (a push to main) gets a group of its own,
# its run id, so it is never cancelled, and never dropped while it waits either (a group keeps ONE pending
# run and replaces it when a newer one queues).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check, Clippy & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pinned; toolchain set below
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Report clippy even when formatting fails.
      - name: cargo clippy
        if: always()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install independent-vector dependency
        if: always()
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.3

      - name: Python vector checks and generation drift
        if: always()
        run: bash scripts/check-test-vectors.sh

      # ripgrep comes from its official release, pinned by version and SHA256 and checked before it is
      # unpacked, not from the Ubuntu package mirrors: when those stopped resolving, this job failed with
      # them. The musl build is static, so it runs on any x86_64 Linux runner.
      - name: Install documentation guard dependency
        if: always()
        run: |
          set -euo pipefail
          RG_VERSION="15.2.0"
          RG_SHA256="33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c"
          RG_NAME="ripgrep-$RG_VERSION-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors --retry-delay 2 --max-time 60 \
            --output "$RUNNER_TEMP/$RG_NAME.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$RG_NAME.tar.gz"
          echo "$RG_SHA256  $RUNNER_TEMP/$RG_NAME.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/ripgrep"
          tar -xzf "$RUNNER_TEMP/$RG_NAME.tar.gz" -C "$RUNNER_TEMP/ripgrep" --strip-components=1 "$RG_NAME/rg"
          "$RUNNER_TEMP/ripgrep/rg" --version
          echo "$RUNNER_TEMP/ripgrep" >> "$GITHUB_PATH"

      - name: Legacy write and documented-symbol guards
        if: always()
        run: |
          bash scripts/check-no-legacy-writes.sh
          bash scripts/check-doc-symbols.sh
          bash scripts/check-core-pins-documented.sh

      - name: Public added-line guard
        if: always()
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-public-added-lines.sh "$DIFF_BASE"

      # The range-read vectors (LD-0105) follow the same rule, with their own generator and gate.
      - name: range vectors match their generator
        if: always()
        run: bash test-vectors/tools/check-direct-range-vectors-generated.sh

      - name: range vector check can go red
        if: always()
        run: bash test-vectors/tools/check-direct-range-vectors-generated.sh --self-test

      # The share safety number vectors (B05e): generated from the contract text, read by the Rust test.
      - name: safety number vectors match their generator
        if: always()
        run: bash test-vectors/tools/check-safety-number-vectors-generated.sh

      - name: safety number vector check can go red
        if: always()
        run: bash test-vectors/tools/check-safety-number-vectors-generated.sh --self-test

      # The backup vectors (LD-0113): four files, four generators, the same rule and gate.
      - name: backup vectors match their generators
        if: always()
        run: bash test-vectors/tools/check-backup-vectors-generated.sh

      - name: backup vector check can go red
        if: always()
        run: bash test-vectors/tools/check-backup-vectors-generated.sh --self-test

      # The archive vectors: archives_v1.json and the fixtures gen_archives_v1.py writes, byte for byte.
      - name: archive vectors match their generator
        if: always()
        run: bash test-vectors/tools/check-archives-vectors-generated.sh

      - name: archive vector check can go red
        if: always()
        run: bash test-vectors/tools/check-archives-vectors-generated.sh --self-test

      # The CLI-auth handshake known answers (task 2378) are Rust constants, not JSON: the independent
      # pure-Python generator must agree with every one of them, and its check must be able to go red.
      - name: cli-auth vectors match their generator
        if: always()
        run: python3 -I test-vectors/tools/make_cli_auth_vectors.py --check beebeeb-core/tests/cli_auth_vectors.rs

      - name: cli-auth vector check can go red
        if: always()
        run: python3 -I test-vectors/tools/make_cli_auth_vectors.py --self-test beebeeb-core/tests/cli_auth_vectors.rs

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pinned; toolchain set below
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: cargo test
        run: cargo test --workspace --locked

      # The legacy-bindings feature gates upload-path tests that guard the UniFFI
      # surface against regressions introduced while feat/core-foundation is in
      # flight (task 2385). The feature is a no-op on main today; feat/core-foundation
      # will add test cases behind it. Running it here now ensures the flag is
      # syntactically valid and nothing accidentally breaks when the feature gains content.
      - name: cargo test beebeeb-uniffi --features legacy-bindings
        run: cargo test -p beebeeb-uniffi --features legacy-bindings

  # Windows is a shipped platform (desktop). Core 0.3.0 did not compile there and no job could see it
  # (#74 round 8): every crate and target must build on Windows, and the crates with platform file code
  # (the trusted publish path in core, used by client and transfer) run their tests there too.
  windows:
    name: Windows build & tests
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pinned; toolchain set below
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      # --keep-going: report every crate that fails on Windows, not only the first one.
      - name: cargo check (every crate, every target)
        run: cargo check --workspace --all-targets --locked --keep-going

      # --no-fail-fast: one run lists every test that fails on Windows.
      - name: cargo test (core, client, transfer)
        run: cargo test --locked --no-fail-fast -p beebeeb-core -p beebeeb-client -p beebeeb-transfer

  dependencies:
    name: Dependency advisories, licenses & sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pinned; toolchain set below
        with:
          toolchain: "1.96.0"

      - name: Install dependency policy tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2

      - name: Dependency advisories
        run: cargo audit

      - name: Dependency licenses and sources
        run: cargo deny --config scripts/deny.toml check licenses sources

  # Exercise the generated JavaScript and TypeScript surface in a real JS engine.
  wasm-js:
    name: WASM JS surface
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pinned; toolchain set below
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0

      # run.sh type-checks the generated .d.ts with tsc; one pinned package, no lockfile needed.
      - name: Install typescript
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/ts" typescript@5.6.3
          echo "$RUNNER_TEMP/ts/node_modules/.bin" >> "$GITHUB_PATH"

      - name: beebeeb-wasm JS surface
        run: beebeeb-wasm/js-tests/run.sh

  claims-guard:
    name: Claims guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Shared engine (vendored verbatim from the workspace canonical): banned
      # origins, host allow-list, provider names, banned claims, regions.
      - name: Run claims guard
        run: bash scripts/claims-guard/claims-guard.sh

      # Scan the whole tree and prove the sweep can reject a forbidden claim.
      - name: Canon sweep self-test
        if: always()
        run: bash scripts/claims-guard/canon-sweep.sh --self-test
      - name: Canon sweep (whole tree, must be 0 rows)
        if: always()
        run: bash scripts/claims-guard/canon-sweep.sh

  # Compile the committed Kotlin UniFFI bindings with kotlinc + JNA.
  # core PR #74 shipped a Kotlin binding with a duplicate `message` field for
  # three rounds and CI never caught it because we never compiled the generated
  # Kotlin. This job detects that class of error before it reaches Android.
  # Two copies of the binding live in the tree (beebeeb-uniffi/bindings/ and
  # bindings/kotlin/); both are compiled.
  kotlin-bindings:
    name: Kotlin bindings compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ubuntu 26 ships Java 25, which Kotlin 2.0.21's IntelliJ runtime cannot
      # parse (JavaVersion.parse throws IllegalArgumentException on "25.0.5").
      # Pin Java 21 LTS so kotlinc has a known-good JVM regardless of the
      # runner's default. Temurin is Eclipse Adoptium OpenJDK — no license issues.
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '21'

      # Download kotlinc 2.0.21 from JetBrains' GitHub releases.
      # The version is pinned in the URL; sha256sum --check hardens the step
      # against a compromised CDN response. The expected hash is hardcoded here
      # (bootstrapped from the first green run; never updated without a review).
      - name: Download and verify kotlinc 2.0.21
        run: |
          KC_URL="https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip"
          curl -sSfL "$KC_URL" -o "$RUNNER_TEMP/kotlinc.zip"
          # sha256 of kotlin-compiler-2.0.21.zip (JetBrains, 2024-09-26 release)
          # Print the actual sha256 so a mismatch is immediately debuggable:
          echo "Actual sha256: $(sha256sum "$RUNNER_TEMP/kotlinc.zip")"
          echo "0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a  $RUNNER_TEMP/kotlinc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"

      # JNA is the only runtime the generated Kotlin bindings reference.
      # sha256: 34ed1e1f27fa896bca50dbc4e99cf3732967cec387a7a0d5e3486c09673fe8c6
      #   (lead-verified against Maven Central's published .sha1
      #    67bf3eaea4f0718cb376a181a629e5f88fa1c9dd)
      - name: Download and verify JNA 5.14.0
        run: |
          JNA_URL="https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar"
          curl -sSfL "$JNA_URL" -o "$RUNNER_TEMP/jna.jar"
          echo "34ed1e1f27fa896bca50dbc4e99cf3732967cec387a7a0d5e3486c09673fe8c6  $RUNNER_TEMP/jna.jar" | sha256sum --check

      - name: Compile beebeeb-uniffi/bindings Kotlin
        run: |
          kotlinc -cp "$RUNNER_TEMP/jna.jar" \
            beebeeb-uniffi/bindings/uniffi/beebeeb_uniffi/beebeeb_uniffi.kt \
            -d "$RUNNER_TEMP/beebeeb-uniffi-bindings.jar"

      - name: Compile bindings/kotlin Kotlin
        run: |
          kotlinc -cp "$RUNNER_TEMP/jna.jar" \
            bindings/kotlin/uniffi/beebeeb_uniffi/beebeeb_uniffi.kt \
            -d "$RUNNER_TEMP/bindings-kotlin.jar"

  # Typecheck the committed Swift UniFFI bindings on macOS. The modulemap
  # references Darwin (macOS SDK), so this job requires a macOS runner.
  # `swiftc -typecheck` exits non-zero on any type error, duplicate definition,
  # or unresolved import — without producing a binary, keeping the job fast.
  swift-bindings:
    name: Swift bindings typecheck
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Typecheck beebeeb-uniffi/bindings Swift
        run: |
          cd beebeeb-uniffi/bindings
          swiftc -typecheck \
            -module-name beebeeb_uniffi \
            -Xcc -fmodule-map-file="$(pwd)/beebeeb_uniffiFFI.modulemap" \
            beebeeb_uniffi.swift
