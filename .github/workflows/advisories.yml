name: Advisories

permissions: {}

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  # On a PR that touches the lockfile the check only warns; the scheduled run is the one that fails.
  pull_request:
    paths:
      - Cargo.lock
      - .github/workflows/advisories.yml

jobs:
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      BB_WORKSPACE: ${{ vars.BB_WORKSPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # action pinned; toolchain set below
        with:
          toolchain: "1.96.0"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Check Cargo.lock against the advisory database
        run: |
          set -euo pipefail
          ws="${BB_WORKSPACE:-/opt/bb/workspace}"
          "$ws/scripts/gate/advisory-check.sh" "$GITHUB_WORKSPACE/Cargo.lock"
