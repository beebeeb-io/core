[package]
name = "beebeeb-wasm"
version.workspace = true
edition.workspace = true
description = "WebAssembly bindings for Beebeeb cryptographic core"

[lib]
crate-type = ["cdylib"]

[dependencies]
beebeeb-core = { path = "../beebeeb-core" }
beebeeb-types = { path = "../beebeeb-types" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
