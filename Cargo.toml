[workspace]
resolver = "2"
members = [
    "beebeeb-core",
    "beebeeb-types",
    "beebeeb-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/beebeeb-io/core"
authors = ["Bram Langelaar <bram@beebeeb.io>", "Guus Langelaar <guus@beebeeb.io>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
