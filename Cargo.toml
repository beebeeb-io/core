[workspace]
resolver = "2"
members = [
    "beebeeb-api",
    "beebeeb-client",
    "beebeeb-core",
    "beebeeb-types",
    "beebeeb-sync",
    "beebeeb-upload",
    "beebeeb-transfer",
    "beebeeb-backup",
    "beebeeb-wasm",
    "beebeeb-uniffi",
    "beebeeb-store",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/beebeeb-io/core"
homepage = "https://beebeeb.io"
description = "Cryptographic core, shared types, and sync engine for Beebeeb E2E encrypted storage"
authors = ["Bram Langelaar <bram@beebeeb.io>", "Guus Langelaar <guus@beebeeb.io>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# The archive tests stream hundreds of MiB through deflate and CRC-32. An
# unoptimized zlib-rs or crc32fast makes each of them take tens of seconds;
# optimizing these two dependencies in dev builds changes no behaviour.
[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "off"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
incremental = false
overflow-checks = true
