[package]
name = "beebeeb-core"
description = "Cryptographic core for Beebeeb — encryption, key derivation, recovery phrases"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
beebeeb-types = { path = "../beebeeb-types" }
aes-gcm = "0.10"
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
hkdf = "0.12"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
bip39 = { version = "2", features = ["rand"] }
thiserror = { workspace = true }
opaque-ke = { version = "4.0.1", features = ["ristretto255", "argon2"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
reed-solomon-erasure = "6"
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
unicode-normalization = "0.1"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
webp = { version = "0.3", optional = true, default-features = false }

# rusqlite bundles C SQLite (used only by `fp_cache`) and cannot target wasm32.
# Gate it to non-wasm targets so `beebeeb-wasm` builds in place. See task 0653.
# rayon (task 0806: parallel `decrypt_names`) is thread-based and likewise can't
# target wasm32 — `decrypt_names` falls back to a sequential iterator on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1"

[features]
default = ["webp-encode"]
webp-encode = ["webp"]

[dev-dependencies]
hex = "0.4"
